spec_version: 1.0
task_id: TSK-2026-0009
title: Implement Deletion of Custom Field Definitions

user_story: >-
  As an authenticated freelancer/consultant,
  I want to remove a custom field template
  so that I can clean up unused or obsolete extended data definitions.

description: >-
  Implement the delete functionality for custom field definitions using FilamentPHP.
  The delete action must be accessible via a "Delete" button on the list page and edit page.
  A confirmation modal must appear before deletion, warning about irreversible data loss
  (especially if the field is in use on existing contacts).
  On confirmation, the custom field record and all associated values on contacts
  (ContactCustomFieldValue records) must be permanently removed (hard delete or soft delete with cascade).
  On successful deletion, show a success notification and refresh the list page.
  Cancellation must close the modal with no changes.

scope:
  max_complexity: simple
  affected_components:
    - backend/models/custom-field
    - backend/models/contact-custom-field-value (if exists)
    - filament/resources/custom-field-resource
    - frontend/filament-panel
  new_endpoints: 0
  new_database_tables: 0
  estimated_hours: 4-7

preconditions:
  - CustomField model and table implemented
  - List, create, and edit functionality for custom fields completed
  - ContactCustomFieldValue model/relation exists or is planned (for cascading values)
  - Filament resource supports delete actions with modals

functional_requirements:
  - REQ-001: "Delete" action on list and edit pages with confirmation modal
  - REQ-002: Modal warning about data loss, especially if field has associated values
  - REQ-003: On confirmation: delete custom field and cascade delete associated contact values
  - REQ-004: Success notification on deletion
  - REQ-005: List page refreshed/updated after deletion

acceptance_criteria:

  - id: AC-001
    scenario: Successful deletion of unused custom field
    given:
      - Authenticated user on custom fields list or edit page
      - Custom field with no associated values on contacts
    when:
      - User clicks "Delete"
      - User confirms in modal
    then:
      - Custom field record removed from database
      - Success notification displayed (e.g., "Custom field deleted successfully")
      - Field no longer appears in list
      - No associated values affected (none exist)

  - id: AC-002
    scenario: Deletion of field in use with warning
    given:
      - Custom field has associated values on one or more contacts
    when:
      - User clicks "Delete"
    then:
      - Confirmation modal shows explicit warning (e.g., "This field is used on contacts. Deleting will permanently remove associated data.")
      - Requires explicit acknowledgment/confirmation to proceed
    when:
      - User confirms
    then:
      - Custom field and all associated contact values deleted
      - Success notification displayed

  - id: AC-003
    scenario: Cancellation of deletion
    given:
      - User has triggered delete modal
    when:
      - User clicks "Cancel" or closes modal
    then:
      - Modal closes
      - No changes to database
      - User remains on current page
      - Field still exists

  - id: AC-004
    scenario: Attempt deletion without confirmation
    given:
      - Delete action triggered
    when:
      - No confirmation provided (e.g., direct attempt bypassing modal)
    then:
      - Deletion prevented
      - No changes occur

  - id: AC-005
    scenario: Bulk deletion not required (single only for MVP)
    given:
      - Multiple fields selected (if bulk actions exist)
    then:
      - Delete applies per field with individual modals (or disabled for bulk in MVP)

non_functional_requirements:
  usability:
    - Clear, alarming warning text in modal
    - Modal non-dismissible except via Cancel/Confirm
  performance:
    - Deletion near-instantaneous even with associated values
  security:
    - Ownership enforced (user can only delete own fields)
    - Cascade protected against unauthorized access

edge_cases:
  - Field heavily used (many contacts) → Deletion still proceeds on confirmation, but warn prominently
  - No associated values table yet → Delete only custom field (graceful fallback)
  - Concurrent edit during delete attempt → Handle with optimistic locking or error

dependencies:
  - TSK-2026-0006  # List Custom Field Definitions
  - TSK-2026-0007  # Create Custom Field Definition
  - TSK-2026-0008  # Edit Custom Field Definition

notes: >-
  Use Filament's DeleteAction with custom modal content for warning.
  Implement cascade via model relation (onDelete('cascade')) or custom logic in mutation.
  For MVP, hard delete is acceptable; soft delete can be added later.
  If ContactCustomFieldValue not yet implemented, delete only custom field and note for future cascade.
  Ensure deletion does not break dependent features (e.g., contact forms reload fields dynamically).