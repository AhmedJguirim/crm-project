spec_version: 1.0
task_id: TSK-2026-0008
title: Implement Editing of Custom Field Definitions

user_story: >-
  As an authenticated freelancer/consultant,
  I want to update an existing custom field template
  so that I can refine its configuration over time.

description: >-
  Implement the edit page for custom field definitions using FilamentPHP.
  The page must be accessible via an "Edit" action on the list page (and optionally detail view if implemented).
  The form must mirror the create form: pre-populated with current values for name, type, options (conditional),
  unique toggle, and position/order selector.
  Server-side validation must match create rules (name unique per user, etc.).
  Changes must apply globally to the field definition.
  On successful submission, show success notification and redirect to the list page.
  Validation errors must display inline with form state preserved.
  If the user attempts a potentially destructive type change (e.g., text to number), display a warning
  (client-side or server-side) about possible data integrity impact on existing contacts, but allow non-destructive changes.

scope:
  max_complexity: simple
  affected_components:
    - backend/models/custom-field
    - filament/resources/custom-field-resource
    - frontend/filament-panel
  new_endpoints: 0
  new_database_tables: 0
  estimated_hours: 5-8

preconditions:
  - CustomField model, table, and list page implemented
  - Create custom field functionality completed
  - At least one custom field exists for testing (seeded or manually created)
  - Filament resource supports edit actions

functional_requirements:
  - REQ-001: "Edit" action on list page routing to pre-populated edit form
  - REQ-002: Form fields identical to create: Name, Type, conditional Options repeater, unique, position selector
  - REQ-003: Pre-population of all current values, including options for select/multiselect
  - REQ-004: Server-side validation matching create rules
  - REQ-005: Warning on potentially destructive type changes
  - REQ-006: On success: update record with new order adjustments, success notification, redirect to list

acceptance_criteria:

  - id: AC-001
    scenario: Successful edit of non-sensitive attributes
    given:
      - Authenticated user on custom fields list page
      - Existing custom field (e.g., name "Website", type "url")
    when:
      - User clicks "Edit" action
      - User modifies name or unique status (valid changes)
      - User submits form
    then:
      - Form pre-populated correctly
      - Record updated in database with new values
      - Success notification displayed
      - Redirected to list page with updated field visible

  - id: AC-002
    scenario: Edit with type-specific options update
    given:
      - Existing select/multiselect custom field with options
    when:
      - User edits field, modifies/adds/removes options
      - User submits valid form
    then:
      - Updated options persisted correctly
      - Field reflects changes globally

  - id: AC-003
    scenario: Validation errors on edit
    given:
      - User on edit form
    when:
      - User attempts duplicate name (matching another field) or invalid data
      - User submits
    then:
      - Form remains on edit page
      - Inline errors displayed
      - No changes persisted
      - Existing values preserved

  - id: AC-004
    scenario: Warning on potentially destructive type change
    given:
      - User on edit form for field potentially in use
    when:
      - User changes type to incompatible (e.g., text to number)
    then:
      - Warning message displayed (e.g., "Changing type may affect existing contact data")
      - Submission still allowed if confirmed/non-destructive
      - Destructive changes permitted only with acknowledgment

  - id: AC-005
    scenario: Order/position update during edit
    given:
      - User on edit form with existing fields
    when:
      - User changes position selector
      - User submits valid form
    then:
      - Field reordered correctly
      - Other fields' order adjusted accordingly

non_functional_requirements:
  usability:
    - Form reactive (conditional options based on type)
    - Clear warning messaging for type changes
  performance:
    - Edit page loads instantly
  security:
    - Ownership enforced (user can only edit own fields)
    - Input sanitized

edge_cases:
  - Changing name on widely used field → Allowed, applies globally
  - Attempting type change on field with existing values → Warning shown, changes saved if submitted
  - No other fields exist → Position options limited appropriately

dependencies:
  - TSK-2026-0006  # List Custom Field Definitions
  - TSK-2026-0007  # Create Custom Field Definition

notes: >-
  Reuse create form schema for edit (Filament EditRecord).
  Implement warning via client-side hint or server validation message on type mismatch.
  For MVP, warning can be generic on any type change; refine with value checks in future tasks.
  Ensure updated field is immediately available in any dependent features.