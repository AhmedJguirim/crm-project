spec_version: 1.0
task_id: TSK-2026-0006
title: Implement List View for Custom Field Definitions

user_story: >-
  As an authenticated freelancer/consultant,
  I want to view a list of my defined custom fields
  so that I can see and manage all available extended data templates.

description: >-
  Implement the index (list) page for custom field definitions using FilamentPHP.
  This dedicated page must display a responsive table containing all custom fields
  belonging to the authenticated user. The table must include essential columns,
  support basic interactions (sorting, searching, pagination), and provide action links
  for editing/deleting individual fields (actions implemented in separate tasks).
  An empty state must be handled gracefully with a clear message and call-to-action
  to create a new custom field. All data must be scoped to the current user for isolation.

scope:
  max_complexity: simple
  affected_components:
    - backend/models/custom-field
    - backend/migrations
    - filament/resources/custom-field-resource
    - frontend/filament-panel
  new_endpoints: 0
  new_database_tables: 1  # custom_fields table
  estimated_hours: 5-8

preconditions:
  - Authentication system fully implemented and Filament panel accessible
  - User model and authenticated session available
  - FilamentPHP resources can be created and registered in panel

functional_requirements:
  - REQ-001: Create CustomField model with fields: name, type (string), unique (boolean), order (integer), user_id (foreign key)
  - REQ-002: Migration for custom_fields table with appropriate columns and indexes
  - REQ-003: Filament CustomFieldResource with index table configuration
  - REQ-004: Table columns: Name, Type, unique (yes/no badge), Actions (edit/delete placeholders)
  - REQ-005: Table features: sorting (name, order), searching (by name), pagination
  - REQ-006: Empty state with message and "Create custom field" button
  - REQ-007: All queries scoped to authenticated user

acceptance_criteria:

  - id: AC-001
    scenario: List page displays existing custom fields
    given:
      - Authenticated user with several custom fields in database (seeded or created manually)
    when:
      - User navigates to the custom fields list page
    then:
      - Table loads with all user's custom fields
      - Columns displayed: Name, Type, unique status, Actions
      - Rows are ordered by 'order' column ascending
      - Pagination controls appear if > default page size

  - id: AC-002
    scenario: Empty state handling
    given:
      - Authenticated user with no custom fields
    when:
      - User navigates to the custom fields list page
    then:
      - Empty state message displayed (e.g., "No custom fields defined yet")
      - Call-to-action button/link to create new custom field visible

  - id: AC-003
    scenario: Sorting functionality
    given:
      - User on list page with multiple custom fields
    when:
      - User clicks column headers (Name or implied Order)
    then:
      - Table re-sorts ascending/descending accordingly
      - URL/parameters update if applicable

  - id: AC-004
    scenario: Search functionality
    given:
      - User on list page with multiple custom fields
    when:
      - User enters text in global search matching a field name
    then:
      - Table filters to show only matching fields
      - No matches show empty state or "No results" message

  - id: AC-005
    scenario: User scoping and isolation
    given:
      - Two different authenticated users, each with their own custom fields
    when:
      - Each user views the list page
    then:
      - Each sees only their own custom fields
      - No cross-user data visible

non_functional_requirements:
  performance:
    - Page loads instantly (<1s) even with 50+ fields
    - Queries use indexes on user_id and searchable columns
  accessibility:
    - Table keyboard-navigable and screen-reader friendly
  security:
    - All data scoped to authenticated user via policies or query scopes

edge_cases:
  - Very long field names → Truncated in table with tooltip
  - Large number of fields (100+) → Pagination works correctly
  - Concurrent field creation by same user → List refreshes accurately

dependencies:
  - TSK-2026-0005  # User Logout (completion of auth epic for full panel access)

notes: >-
  Use Filament Table Builder for columns, sortable(), searchable(), and pagination.
  Implement simple model scope (e.g., where('user_id', auth()->id())).
  Actions (edit/delete) can be placeholders linking to routes implemented later.
  Register resource in Filament panel navigation (e.g., under "Settings" or "Contacts").
  Seed a few sample fields for testing if needed.