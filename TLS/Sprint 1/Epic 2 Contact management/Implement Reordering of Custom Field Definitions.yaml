spec_version: 1.0
task_id: TSK-2026-0010
title: Implement Reordering of Custom Field Definitions

user_story: >-
  As an authenticated freelancer/consultant,
  I want multiple intuitive ways to control the exact display order of my custom fields
  so that they appear in the most logical sequence on contact forms without unnecessary steps or pagination friction.

description: >-
  Implement two complementary methods for reordering custom fields:
  1. Primary bulk method: A dedicated "Reorder fields" button on the custom fields list page that opens a full-screen or large modal
     containing ALL custom fields (non-paginated, single scrollable list) with full drag-and-drop support.
     Changes are persisted on explicit "Save" button click (or optionally auto-save on close).
  2. Secondary quick method: In both create and edit forms, add a position selector dropdown allowing the user to choose exact insertion point.
     Options: "At the beginning", "At the end" (default), and "After [existing field name]" for each current field.
  Order is stored in an integer 'order' column (lower = higher in list). All reordering operations must update this column atomically
  for all affected fields, ensuring no gaps/duplicates and immediate reflection in contact create/edit/view forms.
  The implementation must be performant even with 50–100 fields (smooth drag-and-drop, fast load).

scope:
  max_complexity: medium
  affected_components:
    - backend/models/custom-field
    - filament/resources/custom-field-resource
    - frontend/filament-panel
    - frontend/modal-components
  new_endpoints: 0
  new_database_tables: 0
  estimated_hours: 10-14

preconditions:
  - CustomField model with integer 'order' column (default sequential, e.g., 1,2,3...)
  - List, create, edit, and delete functionality for custom fields fully implemented
  - Filament resource configured and user scoping enforced
  - At least 10 custom fields seedable for testing long lists

functional_requirements:
  - REQ-001: "Reorder fields" button on list page opens large modal with complete non-paginated list of all user's custom fields
  - REQ-002: Modal list supports smooth drag-and-drop reordering (visual feedback during drag)
  - REQ-003: Modal has explicit "Save" button (and optional "Cancel"); changes persist only on Save
  - REQ-004: Create and edit forms include position selector dropdown with dynamic options based on current fields
  - REQ-005: Position selector defaults to "At the end"
  - REQ-006: On create/edit save: field inserted at exact chosen position, all other orders adjusted atomically
  - REQ-007: Success notification on both methods ("Order updated successfully")

acceptance_criteria:

  - id: AC-001
    scenario: Bulk reordering via modal with moderate number of fields
    given:
      - Authenticated user with 10–20 custom fields in known order
    when:
      - User clicks "Reorder fields" button on list page
      - Modal opens showing all fields in current order
      - User drags several fields to new positions
      - User clicks "Save"
    then:
      - Modal closes
      - Success notification displayed
      - List page reflects new order immediately
      - Subsequent contact create/edit forms show fields in new order

  - id: AC-002
    scenario: Bulk reordering cancellation
    given:
      - User has opened reorder modal and dragged fields
    when:
      - User clicks "Cancel" or closes modal
    then:
      - Modal closes
      - No success notification
      - Original order unchanged in database and UI

  - id: AC-003
    scenario: Quick positioning during creation
    given:
      - Authenticated user with several existing custom fields
    when:
      - User creates new custom field
      - User selects "After [specific existing field]" or "At the beginning"
      - User submits valid form
    then:
      - New field inserted at exact chosen position
      - All other fields' order values shifted correctly (no gaps/duplicates)
      - List page and future contact forms reflect precise position

  - id: AC-004
    scenario: Quick positioning during edit
    given:
      - Existing custom field
    when:
      - User edits field and changes position selector to move it (e.g., from position 5 to 2)
      - User submits valid form
    then:
      - Field moved to new position
      - Affected fields reordered atomically
      - Changes reflected immediately everywhere

  - id: AC-005
    scenario: Performance with long list (edge case)
    given:
      - Authenticated user with 50–100 custom fields
    when:
      - User opens reorder modal
      - User performs multiple drag operations
      - User saves
    then:
      - Modal loads quickly (<2s)
      - Drag-and-drop remains smooth and responsive (no visible lag)
      - Save completes quickly (<2s)
      - Order persists correctly

  - id: AC-006
    scenario: Default position on creation
    given:
      - User on create form with no position selected
    when:
      - User submits valid form
    then:
      - New field appended at the end (highest order value)

non_functional_requirements:
  performance:
    - Modal load and drag operations smooth with up to 100 fields
    - Order updates atomic and fast (transaction)
  usability:
    - Clear visual drag handles and drop zones
    - Dropdown options clearly labeled and ordered by current sequence
    - Loading indicator during save if needed
  accessibility:
    - Drag-and-drop keyboard-accessible fallback (up/down arrows)
    - Modal and dropdown screen-reader friendly

edge_cases:
  - Only one custom field → Modal shows single item, position selector limited
  - No custom fields → "Reorder fields" button disabled or modal shows empty state
  - Concurrent reordering attempts → Last save wins, or optimistic locking prevents conflicts
  - Very long field names in modal → Truncated with tooltip

dependencies:
  - TSK-2026-0006  # List Custom Field Definitions
  - TSK-2026-0007  # Create Custom Field Definition
  - TSK-2026-0008  # Edit Custom Field Definition

notes: >-
  Use a Filament custom page or Livewire component for the reorder modal.
  Drag-and-drop: Integrate Sortable.js or Filament's built-in sortable table (ensure non-paginated).
  Position dropdown: Populate dynamically from ordered query of user's fields.
  Order logic: On save, assign sequential integers starting from 1 based on new sequence.
  For create/edit insertion: Reorder all fields in a single transaction after determining insertion index.
  Test thoroughly with seeded data for order integrity.