spec_version: 1.0
task_id: TSK-2026-0005
title: Implement User Logout

user_story: >-
  As a logged-in freelancer/consultant,
  I want to log out securely
  so that my session ends on shared devices.

description: >-
  Implement a secure logout mechanism that terminates the user's authenticated session
  and redirects them to the login page. The logout action must be accessible via a clearly
  visible "Log out" link/button in the Filament admin panel's user menu or navigation.
  On successful logout, display a brief success toast/notification (optional but recommended).
  Use Laravel's built-in authentication features to invalidate the session and regenerate
  the CSRF token for security. The flow must be immediate and reliable, with no residual
  access to protected routes after logout.

scope:
  max_complexity: simple
  affected_components:
    - backend/auth
    - frontend/filament-panel
  new_endpoints: 0
  new_database_tables: 0
  estimated_hours: 2-4

preconditions:
  - Authentication system fully implemented (login, session management from previous tasks)
  - FilamentPHP panel configured with user menu/navigation
  - Tailwind CSS set up for styling
  - Protected routes correctly guarded by auth middleware

functional_requirements:
  - REQ-001: "Log out" action in Filament user menu or global navigation
  - REQ-002: On trigger: invalidate session, regenerate CSRF token
  - REQ-003: Redirect to /login page
  - REQ-004: Optional success toast ("Logged out successfully")
  - REQ-005: Consistent styling with rest of panel

acceptance_criteria:

  - id: AC-001
    scenario: Successful logout from authenticated session
    given:
      - User is authenticated and on any protected page (e.g., dashboard)
    when:
      - User clicks "Log out" in the user menu
    then:
      - Session is immediately invalidated
      - User is redirected to /login page
      - Success toast displayed (if implemented)
      - Attempting to access any protected route redirects to login

  - id: AC-002
    scenario: No access to protected routes after logout
    given:
      - User has just logged out
    when:
      - User attempts to navigate back to a protected page (e.g., via browser back button or direct URL)
    then:
      - Redirected to /login page
      - No authenticated session or user data accessible

  - id: AC-003
    scenario: Logout from multiple tabs/devices
    given:
      - User is logged in on multiple browser tabs
    when:
      - User logs out in one tab
    then:
      - Other tabs lose authenticated state on next action/refresh
      - Protected content no longer accessible

  - id: AC-004
    scenario: Logout confirmation (optional modal if implemented)
    given:
      - "Log out" action clicked
    when:
      - User confirms (if modal present) or action proceeds
    then:
      - Logout executes as expected
      - Cancellation (if modal) returns user to current page without logout

non_functional_requirements:
  security:
    - Session fully invalidated
    - CSRF token regenerated
    - No sensitive data left in browser storage
  accessibility:
    - Logout link keyboard-navigable and clearly labeled
  performance:
    - Logout instantaneous (<500ms)

edge_cases:
  - Idle session timeout → Handled by Laravel defaults (separate if needed)
  - Network interruption during logout → Session still invalidated server-side
  - Direct POST to logout route → Protected by CSRF and auth middleware

dependencies:
  - TSK-2026-0002  # Log In (for session management)

notes: >-
  Use Filament's built-in user menu logout action if available, or add custom menu item.
  Route: POST /logout (standard Laravel/Breeze/Fortify).
  Ensure logout invalidates all guards if multi-auth used (single guard for MVP).
  Keep implementation minimal and leverage Laravel's Auth::logout().