spec_version: 1.0
task_id: TSK-2026-0002
title: Implement User Login

user_story: >-
  As a registered freelancer/consultant,
  I want to log in with email and password
  so that I can access my contacts and data.

description: >-
  Implement a secure login form that allows registered users to authenticate
  using their email and password. The form must be accessible at /login,
  styled consistently with the application's Tailwind-based design,
  and integrated with FilamentPHP's authentication system.
  On successful login, the user is redirected to the dashboard.
  If it is the user's first login, a flag must be checked to trigger the onboarding tour
  (implemented in a separate task). All attempts include proper validation,
  rate limiting, and clear feedback. Include a "Remember me" checkbox and
  a visible "Forgot password?" link that navigates to the password reset flow.
  Use Laravel Breeze or Fortify as the base authentication scaffolding.

scope:
  max_complexity: simple
  affected_components:
    - backend/auth
    - frontend/auth-pages
  new_endpoints: 0
  new_database_tables: 0
  estimated_hours: 3-6

preconditions:
  - Laravel project with FilamentPHP installed and authentication scaffolding (Breeze/Fortify) in place
  - Users table populated with at least one registered user (from previous registration task or manual seeding)
  - Tailwind CSS set up for styling
  - Session and cookie configuration functional

functional_requirements:
  - REQ-001: Login form with fields: Email (required), Password (required), "Remember me" checkbox
  - REQ-002: "Forgot password?" link directing to password reset request page
  - REQ-003: Server-side authentication and session creation
  - REQ-004: Rate limiting on login attempts
  - REQ-005: On success: redirect to dashboard and check first-time flag for onboarding trigger
  - REQ-006: Consistent responsive design matching registration page

acceptance_criteria:

  - id: AC-001
    scenario: Successful login with correct credentials
    given:
      - User is on the /login page
      - User has an existing account with known email and password
    when:
      - User enters correct email and password
      - User optionally checks "Remember me"
      - User submits the form
    then:
      - User is authenticated and session created
      - Redirected to dashboard
      - If onboarding_completed flag is false, onboarding tour is triggered (via separate mechanism)
      - Protected routes are accessible

  - id: AC-002
    scenario: Failed login with invalid credentials
    given:
      - User is on the /login page
    when:
      - User enters incorrect password or non-existent email
      - User submits the form
    then:
      - Generic error message displayed: "Invalid credentials" or equivalent
      - Form remains on /login page
      - No session created
      - No redirect to dashboard

  - id: AC-003
    scenario: Login with empty fields
    given:
      - User is on the /login page
    when:
      - User submits form with empty email or password fields
    then:
      - Inline validation errors displayed (e.g., "The email field is required.")
      - Form remains on /login page
      - No authentication attempt processed

  - id: AC-004
    scenario: Rate limiting on excessive failed attempts
    given:
      - User performs multiple rapid failed login attempts
    when:
      - Attempt count exceeds throttle limit (default Laravel throttle, e.g., 5 attempts)
    then:
      - Error message: "Too many login attempts. Please try again later."
      - Further submissions blocked temporarily
      - No session created

  - id: AC-005
    scenario: "Remember me" functionality
    given:
      - User successfully logs in with "Remember me" checked
    when:
      - User closes browser and returns later
    then:
      - User remains authenticated (extended session/cookie)

non_functional_requirements:
  security:
    - Rate limiting applied to login route
    - No information leakage about email existence
    - Secure session handling
  accessibility:
    - Form fields properly labeled and keyboard-navigable
  performance:
    - Page loads instantly (<500ms)

edge_cases:
  - Case-insensitive email matching if configured
  - Very long email/password input → Handled by validation/max length
  - User logged in from multiple devices → Sessions remain independent

notes: >-
  Override Filament/Breeze login views for consistent Tailwind styling.
  Ensure "Forgot password?" link routes correctly to reset request page (implemented separately).
  First-time onboarding trigger relies on user flag set during registration or login check.
  Dependencies: Registration task (TSK-2026-0001) for user creation.