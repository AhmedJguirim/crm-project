spec_version: 1.0
task_id: TSK-2026-0003
title: Implement Password Reset Flow

user_story: >-
  As a registered freelancer/consultant who forgot their password,
  I want to reset my password via email
  so that I can regain access without losing data.

description: >-
  Implement a complete password reset flow allowing users to request a reset link via email,
  receive a time-limited reset token, and set a new password.
  The flow must include a "Forgot password?" link on the login page, a request form at /forgot-password,
  a reset form at /reset-password/{token}, and queued email delivery.
  All steps must include proper validation, security best practices (no account existence leakage),
  and clear user feedback. Use Laravel's built-in password reset features (notifications, broker, tables).
  Emails must be queued and use a reliable provider (Resend/Mailgun). On successful reset,
  the user is automatically logged in and redirected to the dashboard.

scope:
  max_complexity: simple
  affected_components:
    - backend/auth
    - backend/notifications
    - frontend/auth-pages
    - database/password_resets-table
  new_endpoints: 0
  new_database_tables: 1  # password_resets (or password_reset_tokens if Laravel 9+)
  estimated_hours: 5-8

preconditions:
  - Authentication system implemented (registration and login from previous tasks)
  - Mail configuration set up and queued notifications functional
  - Users table populated with at least one registered user
  - Tailwind CSS set up for styling auth pages

functional_requirements:
  - REQ-001: "Forgot password?" link on login page routing to request form
  - REQ-002: Request form accepting email address with validation
  - REQ-003: Queued email delivery with secure reset link/token
  - REQ-004: Reset form accepting new password and confirmation
  - REQ-005: On success: update password, auto-login, redirect to dashboard
  - REQ-006: Consistent responsive design matching other auth pages

acceptance_criteria:

  - id: AC-001
    scenario: Full successful password reset
    given:
      - Existing registered user
      - User is on /login and clicks "Forgot password?"
    when:
      - User enters their registered email on /forgot-password
      - User submits request
      - User receives email and clicks reset link
      - User enters new strong password (≥8 chars) with matching confirmation
      - User submits reset form
    then:
      - Reset email is queued and sent with valid time-limited token
      - Reset page loads successfully with token
      - Password is updated (hashed) in database
      - User is automatically authenticated
      - Redirected to dashboard with success toast ("Password updated successfully")
      - Old password no longer works

  - id: AC-002
    scenario: Password reset request with non-existent email
    given:
      - User submits request with unregistered email
    when:
      - Form is submitted
    then:
      - Success message displayed: "We have emailed your password reset link!" (no existence leakage)
      - No email sent (verifiable in logs/queue)
      - No database changes

  - id: AC-003
    scenario: Validation errors on reset form
    given:
      - User has valid reset token/link open
    when:
      - User submits short password or mismatched confirmation
    then:
      - Inline errors displayed (e.g., "Password must be at least 8 characters", "Confirmation does not match")
      - Form remains on reset page
      - No password update

  - id: AC-004
    scenario: Expired or invalid reset token
    given:
      - User attempts reset with expired/invalid token
    when:
      - Reset page is accessed or form submitted
    then:
      - Clear error message: "This password reset token is invalid" or "expired"
      - Option to request new reset link

  - id: AC-005
    scenario: Rate limiting on reset requests
    given:
      - Multiple rapid reset requests for same email
    when:
      - Threshold exceeded
    then:
      - Error: "Too many reset requests. Please try again later."
      - Further submissions blocked temporarily

non_functional_requirements:
  security:
    - Tokens time-limited (default 1 hour) and single-use
    - No account existence leakage on request
    - Rate limiting on request route
    - Secure random token generation
  performance:
    - All pages load instantly (<500ms)
    - Emails queued, not blocking
  accessibility:
    - Forms keyboard-navigable and labeled

edge_cases:
  - Malformed or tampered token in URL → Graceful error
  - User requests multiple resets → Latest token invalidates previous
  - Email delivery failure → Logged, user can retry

dependencies:
  - TSK-2026-0002  # Log In (for "Forgot password?" link integration)

notes: >-
  Use Laravel's built-in Password facade, notifications, and password_resets table.
  Customize notification email template minimally (app name, branding).
  Override Breeze/Fortify views for consistent Tailwind styling.
  Ensure reset success triggers any first-time flags if applicable.