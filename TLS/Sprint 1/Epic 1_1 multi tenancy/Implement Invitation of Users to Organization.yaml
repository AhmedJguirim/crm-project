spec_version: 1.0
task_id: TSK-2026-0014
title: Implement Invitation of Users to Organization

user_story: >-
  As an Organization owner/admin,
  I want to invite users by email to join my Organization
  so that teams can collaborate on the same data.

description: >-
  Implement a secure invitation system allowing Organization owners and admins
  to invite new or existing users by email. The invitation form must be located
  in Organization settings or members management page. Invites specify a role
  (admin, member, viewer) and generate a unique, time-limited token sent via queued email.
  The email contains an accept link that handles both registered and unregistered users.
  A pending invites list shows outstanding invitations with options to resend or revoke.
  Invites are stored in a dedicated table with status tracking (pending, accepted, expired, revoked).
  Permissions enforce that only owners/admins can send invites.
  On acceptance (separate task), the user is added to the Organization with the assigned role.

scope:
  max_complexity: medium
  affected_components:
    - backend/models/organization-invite
    - backend/notifications/invitation-email
    - filament/resources/organization-resource (settings/members)
    - backend/mail
    - backend/middleware/permissions
  new_endpoints: 2  # invite send, resend/revoke actions
  new_database_tables: 1  # organization_invites
  estimated_hours: 12-16

preconditions:
  - Organization model, membership pivot, and role system in place (from previous tenancy tasks)
  - Multi-tenancy and current Organization context fully functional
  - Queued email notifications configured and reliable
  - User authentication and registration complete

functional_requirements:
  - REQ-001: Invitation form in Organization settings/members page (accessible only to owner/admin)
  - REQ-002: Form fields: Email (required), Role (select: admin, member, viewer)
  - REQ-003: Generate unique token, expiry (e.g., 7 days), store invite record
  - REQ-004: Queue and send invitation email with personalized accept link
  - REQ-005: Pending invites list with status, expiry, resend/revoke actions
  - REQ-006: Validation: email format, prevent inviting existing members, role permission check

acceptance_criteria:

  - id: AC-001
    scenario: Successful invite to new email
    given:
      - Authenticated owner/admin in Organization settings
    when:
      - User enters valid unused email and selects role (e.g., member)
      - User submits invite form
    then:
      - Invite record created with pending status, token, expiry
      - Invitation email queued and sent with valid accept link
      - Success notification ("Invitation sent")
      - Pending invites list updated with new entry

  - id: AC-002
    scenario: Invite to existing user email
    given:
      - Email belongs to registered user not in Organization
    when:
      - Invite submitted
    then:
      - Invite created and email sent
      - Existing user can accept via link (adds to Organization)

  - id: AC-003
    scenario: Permission enforcement
    given:
      - Non-owner/admin user (e.g., member) in Organization
    when:
      - User attempts to access invite form
    then:
      - Access denied / form hidden
      - No invites can be sent

  - id: AC-004
    scenario: Pending invites management
    given:
      - Several pending invites exist
    when:
      - Owner views pending list
      - Owner clicks resend or revoke on an invite
    then:
      - Resend: New email sent, expiry optionally extended
      - Revoke: Invite status updated to revoked, no longer usable
      - List reflects changes instantly

  - id: AC-005
    scenario: Validation and error handling
    given:
      - User submitting invite
    when:
      - Invalid email, already member, or missing role
    then:
      - Inline errors displayed
      - No invite created or email sent

non_functional_requirements:
  performance:
    - Invite send and list load <1s
  security:
    - Tokens unique and unguessable
    - Expiry enforced
    - Rate limiting on invite sends per Organization
    - No leakage of existing membership status
  usability:
    - Clear email template with Organization name and sender
    - Pending list sortable/filterable

edge_cases:
  - Multiple invites to same email → Latest overrides or blocked
  - Expired invite in list → Shown with status, revoke option
  - Email delivery failure → Logged, resend available
  - Invite existing owner → Blocked with error

dependencies:
  - TSK-2026-0011  # Personal Organization Creation
  - TSK-2026-0012  # Organization Switching
  - TSK-2026-0013  # Create Additional Organization

notes: >-
  Use separate organization_invites table: id, organization_id, email, token, role, status, expires_at.
  Email template: Customizable minimally, include accept link with token.
  Acceptance handled in separate task (Story 5).
  Use Filament actions/modals for send/resend/revoke.
  Role validation against current user's permission.
  Test with seeded invites and email mocking.