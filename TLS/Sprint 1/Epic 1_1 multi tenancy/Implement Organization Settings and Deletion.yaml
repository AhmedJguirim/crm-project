spec_version: 1.0
task_id: TSK-2026-0018
title: Implement Organization Settings and Deletion

user_story: >-
  As an Organization owner,
  I want to update settings or delete the Organization
  so that I can manage or clean up workspaces.

description: >-
  Implement a dedicated Organization settings page accessible only to the owner.
  The page must allow updating basic settings: Organization name (unique globally), description (textarea),
  and logo (image upload/replacement/removal). Changes are saved immediately with validation.
  Additionally, provide a dangerous "Delete Organization" section with a confirmation modal,
  explicit warning about irreversible data loss (all contacts, custom fields, tasks, members, etc.),
  and requirement for typed confirmation (e.g., Organization name).
  On deletion: cascade delete all associated data (memberships, resources), but block if other members exist
  (require removal/transfer first). Personal Organizations cannot be deleted (or allowed with full data loss warning).
  After deletion, redirect to user's remaining Organization (personal fallback) with notification.

scope:
  max_complexity: medium
  affected_components:
    - backend/models/organization
    - filament/resources/organization-resource (settings page)
    - backend/controllers/deletion
    - frontend/filament-panel
    - backend/storage (logo)
  new_endpoints: 0
  new_database_tables: 0
  estimated_hours: 10-14

preconditions:
  - Organization model with name, description, logo fields
  - Membership, roles, and ownership fully implemented
  - Tenancy scoping and switching functional
  - At least one non-personal Organization for testing deletion

functional_requirements:
  - REQ-001: Settings page accessible only to owner (via policy)
  - REQ-002: Form for updating name, description, logo upload/remove
  - REQ-003: Server-side validation: name unique, file type/size for logo
  - REQ-004: Delete section with confirmation modal and typed verification
  - REQ-005: Block deletion if other members exist
  - REQ-006: Cascade deletion of all tenant data on confirm
  - REQ-007: Post-deletion redirect to personal or remaining Organization

acceptance_criteria:

  - id: AC-001
    scenario: Update Organization settings
    given:
      - Owner in Organization settings
    when:
      - User changes name/description or uploads new logo
      - User submits form
    then:
      - Changes persisted
      - Logo stored/updated
      - Success notification
      - Changes reflected in switcher and elsewhere

  - id: AC-002
    scenario: Successful Organization deletion (solo owner)
    given:
      - Owner in single-member Organization
    when:
      - User triggers delete, confirms modal, types name
    then:
      - All data cascaded/deleted
      - Organization record removed
      - User redirected to personal Organization
      - Success/warning notification

  - id: AC-003
    scenario: Deletion blocked by members
    given:
      - Organization with multiple members
    when:
      - Owner attempts delete
    then:
      - Error/warning: "Remove or transfer all members first"
      - Deletion prevented

  - id: AC-004
    scenario: Validation on settings update
    given:
      - User attempts duplicate name or invalid logo
    when:
      - Form submitted
    then:
      - Inline errors
      - No changes persisted

  - id: AC-005
    scenario: Personal Organization deletion handling
    given:
      - User in personal Organization
    when:
      - Delete attempted
    then:
      - Either blocked ("Cannot delete personal workspace") or allowed with extra warning

non_functional_requirements:
  performance:
    - Settings load and save <2s
    - Deletion efficient even with data
  usability:
    - Delete section visually dangerous (red, separated)
    - Clear irreversible warnings
  security:
    - Only owner can access/modify/delete
    - Typed confirmation prevents accidents

edge_cases:
  - No remaining Organizations after delete → Redirect to dashboard or setup flow
  - Large logo file → Validation reject
  - Name change conflict → Unique error
  - Deletion during active session → Force logout or context reset

dependencies:
  - TSK-2026-0011  # Personal Organization Creation
  - TSK-2026-0013  # Create Additional Organization
  - TSK-2026-0016  # Manage Members and Roles
  - TSK-2026-0017  # Global Resource Scoping

notes: >-
  Use Filament Edit page for settings (owner-only).
  Logo: Spatie Media Library or simple storage.
  Deletion: Custom action with multi-step confirmation.
  Cascade: Use model events or direct deletes in transaction.
  Personal Org deletion: Recommend block for safety.
  Test data cleanup thoroughly.